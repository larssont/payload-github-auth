version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      payload:
        patterns:
          - payload
          - "@payloadcms/*"
      development:
        dependency-type: development
        exclude-patterns:
          - payload
          - "@payloadcms/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "payload"
        versions: [">=4.0.0-canary.0 <4.0.0"]
      - dependency-name: "@payloadcms/*"
        versions: [">=4.0.0-canary.0 <4.0.0"]
